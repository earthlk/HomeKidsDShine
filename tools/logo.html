<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ปรับตำแหน่งโลโก้ — Homey Kids D Shine</title>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Anuphan:wght@400;500&display=swap">
<style>
  :root { --clay:#A96246; --cream:#FFF9ED; --ink:#3D2F22; --line:#E9DDC8; --mist:#98876F; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Anuphan',sans-serif; background:var(--cream); color:var(--ink); padding:24px; }
  h1 { font-family:'Mitr',sans-serif; font-size:1.3rem; font-weight:500; margin-bottom:4px; }
  .lede { color:var(--mist); font-size:.9rem; margin-bottom:24px; }
  .wrap { display:grid; grid-template-columns:1fr 320px; gap:24px; max-width:1000px; }
  @media (max-width:820px){ .wrap{ grid-template-columns:1fr; } }

  .panel { background:#fff; border:1px solid var(--line); border-radius:20px; padding:20px; }

  /* ตารางพิกัดช่วยให้เห็นว่าแต่ละหน่วยอยู่ตรงไหน */
  .stage { display:flex; justify-content:center; padding:16px 0; }
  .stage svg { width:260px; height:auto; color:var(--clay); }
  .grid line { stroke:var(--line); stroke-width:.08; }
  .grid .axis { stroke:#D9C7B4; stroke-width:.16; }

  .sizes { display:flex; align-items:flex-end; gap:20px; justify-content:center;
           padding-top:16px; border-top:1px solid var(--line); margin-top:16px; }
  .sizes div { text-align:center; color:var(--clay); }
  .sizes span { display:block; font-size:.72rem; color:var(--mist); margin-top:4px; }

  label { display:block; font-size:.85rem; margin:14px 0 4px; }
  label b { float:right; font-family:'Mitr',sans-serif; color:var(--clay); font-weight:500; }
  input[type=range] { width:100%; accent-color:var(--clay); }

  .out { margin-top:20px; }
  textarea { width:100%; height:150px; font-family:ui-monospace,monospace; font-size:.72rem;
             padding:12px; border:1px solid var(--line); border-radius:12px;
             background:var(--cream); color:var(--ink); resize:vertical; }
  button { margin-top:10px; padding:10px 18px; border:none; border-radius:12px;
           background:var(--clay); color:#fff; font-family:inherit; font-weight:600; cursor:pointer; }
  .hint { font-size:.78rem; color:var(--mist); margin-top:10px; line-height:1.6; }
</style>
</head>
<body>

<h1>ปรับตำแหน่งโลโก้</h1>
<p class="lede">ลากแถบเลื่อนแล้วดูผลทันที เสร็จแล้วคัดลอกโค้ดไปวางแทนใน <code>js/ui.js</code></p>

<div class="wrap">
  <div class="panel">
    <div class="stage" id="stage"></div>
    <div class="sizes" id="sizes"></div>
  </div>

  <div class="panel">
    <label>ความสูงหลังคา <b id="v-roofTop">4.0</b></label>
    <input type="range" id="roofTop" min="1" max="10" step="0.2" value="4">

    <label>ความกว้างหลังคา <b id="v-roofW">11.4</b></label>
    <input type="range" id="roofW" min="6" max="13" step="0.2" value="11.4">

    <label>ระดับชายคา <b id="v-roofBot">14.6</b></label>
    <input type="range" id="roofBot" min="8" max="20" step="0.2" value="14.6">

    <label>ความหนาเส้นหลังคา <b id="v-stroke">3.2</b></label>
    <input type="range" id="stroke" min="1.5" max="5" step="0.1" value="3.2">

    <label>ตำแหน่งหน้าต่างแนวตั้ง <b id="v-winY">11.2</b></label>
    <input type="range" id="winY" min="6" max="18" step="0.2" value="11.2">

    <label>ขนาดช่องหน้าต่าง <b id="v-winSize">3.1</b></label>
    <input type="range" id="winSize" min="1.5" max="5" step="0.1" value="3.1">

    <label>ระยะห่างระหว่างช่อง <b id="v-winGap">0.8</b></label>
    <input type="range" id="winGap" min="0" max="3" step="0.1" value="0.8">

    <label>ความมนของช่อง <b id="v-winRadius">0.9</b></label>
    <input type="range" id="winRadius" min="0" max="2.5" step="0.1" value="0.9">

    <div class="out">
      <textarea id="code" readonly></textarea>
      <button id="copy">คัดลอกโค้ด</button>
      <p class="hint">
        ระบบพิกัดคือ 28 หน่วยกว้าง 24 หน่วยสูง จุด 0,0 อยู่มุมซ้ายบน
        ค่า y เพิ่มขึ้นเมื่อเลื่อนลง ไม่ใช่ขึ้น
      </p>
    </div>
  </div>
</div>

<script>
const ids = ['roofTop','roofW','roofBot','stroke','winY','winSize','winGap','winRadius'];

function read() {
  const v = {};
  ids.forEach(id => { v[id] = parseFloat(document.getElementById(id).value); });
  return v;
}

// สร้าง SVG จากค่าที่ตั้งไว้ ใช้ตัวเดียวกับที่จะไปวางในโค้ดจริง
function build(v, withGrid) {
  const cx = 14;                       // กึ่งกลางแนวนอนของกรอบ 28 หน่วย
  const half = v.roofW / 2;
  const wx = cx - v.winSize - v.winGap / 2;   // ขอบซ้ายของช่องซ้าย
  const wx2 = cx + v.winGap / 2;              // ขอบซ้ายของช่องขวา
  const wy2 = v.winY + v.winSize + v.winGap;  // แถวล่าง

  const rect = (x, y) =>
    `<rect x="${r(x)}" y="${r(y)}" width="${r(v.winSize)}" height="${r(v.winSize)}" rx="${r(v.winRadius)}"/>`;

  let grid = '';
  if (withGrid) {
    for (let i = 0; i <= 28; i++)
      grid += `<line class="${i === 14 ? 'axis' : ''}" x1="${i}" y1="0" x2="${i}" y2="24"/>`;
    for (let i = 0; i <= 24; i++)
      grid += `<line x1="0" y1="${i}" x2="28" y2="${i}"/>`;
    grid = `<g class="grid">${grid}</g>`;
  }

  return `<svg viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="${r(v.stroke)}" `
    + `stroke-linecap="round" stroke-linejoin="round">`
    + grid
    + `<path d="M${r(cx - half)} ${r(v.roofBot)}L${r(cx)} ${r(v.roofTop)}l${r(half)} ${r(v.roofBot - v.roofTop)}"/>`
    + `<g fill="currentColor" stroke="none">`
    + rect(wx, v.winY) + rect(wx2, v.winY)
    + rect(wx, wy2) + rect(wx2, wy2)
    + `</g></svg>`;
}

function r(n) { return Math.round(n * 10) / 10; }

function render() {
  const v = read();
  ids.forEach(id => { document.getElementById('v-' + id).textContent = v[id].toFixed(1); });

  document.getElementById('stage').innerHTML = build(v, true);

  // ดูขนาดจริงทั้งสามที่ที่ใช้งาน
  const svg = build(v, false);
  document.getElementById('sizes').innerHTML =
    [['หน้าเข้าสู่ระบบ', 66], ['แถบซ้าย', 40], ['แถบบนมือถือ', 32]]
      .map(([label, w]) =>
        `<div><div style="width:${w}px">${svg}</div><span>${label}</span></div>`).join('');

  document.getElementById('code').value =
    "  brand:    '" + svg + "',";
}

ids.forEach(id => document.getElementById(id).addEventListener('input', render));

document.getElementById('copy').onclick = () => {
  const box = document.getElementById('code');
  box.select();
  document.execCommand('copy');
  document.getElementById('copy').textContent = 'คัดลอกแล้ว';
  setTimeout(() => { document.getElementById('copy').textContent = 'คัดลอกโค้ด'; }, 1500);
};

render();
</script>
</body>
</html>
